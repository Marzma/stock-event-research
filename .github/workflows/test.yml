name: Test and demo
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: stock-research --config examples/demo.json --output artifacts/demo
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-demo-report
          path: |
            artifacts/demo/index.html
            artifacts/demo/report.md
            artifacts/demo/*.csv
          retention-days: 7
